<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Chronos</title>
<meta name="theme-color" content="#F4EFE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chronos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Colores =====
   Día: marfil, tinta negra y bronce.  Noche: verde inglés, bronce y crema. */
:root{
  --bg:#F4EFE4; --paper:#FBF8F1; --ink:#15140F; --ink2:#3B382F; --muted:#655E50;
  --line:#DED4C1; --line2:#C8BBA2; --bronze:#8A6A3E; --bronzeT:#765830; --tint:#ECE3D2;
  --btn:#15140F; --onbtn:#F7F2E7; --up:#22528F; --upBg:#E3EAF3; --dn:#A24B14; --dnBg:#F4E4D6;
  --shadow:0 1px 0 rgba(21,20,15,.04), 0 10px 24px -14px rgba(21,20,15,.28);
  /* rampa de esfuerzo (RPE 0–10): calma → bronce → naranja quemado. Solo acompaña al número y al texto. */
  --r0:#D3CCB8; --r1:#C8BFA4; --r2:#BCB08F; --r3:#AFA07A; --r4:#A28F65; --r5:#957D51; --r6:#8A6A3E; --r7:#925E2E; --r8:#995423; --r9:#9F4D1A; --r10:#A24B14;
  --serif:'Cormorant Garamond','Cormorant',Garamond,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#122519; --paper:#18301F; --ink:#F2EBDC; --ink2:#DCD3BF; --muted:#BBB29B;
  --line:#2C4935; --line2:#41634C; --bronze:#C49A62; --bronzeT:#C9A06A; --tint:#1E3A27;
  --btn:#C49A62; --onbtn:#10200F; --up:#9DC0F0; --upBg:#1C3445; --dn:#EDA672; --dnBg:#3A2E1C;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 12px 26px -16px rgba(0,0,0,.7);
  --r0:#3A5A44; --r1:#4A664C; --r2:#5B7353; --r3:#6E8059; --r4:#848A5D; --r5:#9D925F; --r6:#C49A62; --r7:#CF9C66; --r8:#DA9F6A; --r9:#E4A36E; --r10:#EDA672;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0}
button:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
h1,h2{margin:0;font-weight:500}
.serif{font-family:var(--serif);font-feature-settings:"lnum" 1,"tnum" 1}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:520px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.ico{width:20px;height:20px;flex-shrink:0}

/* ===== Botones base ===== */
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:600;color:var(--ink2)}
.primary{width:100%;height:56px;border-radius:16px;border:0;background:var(--btn);color:var(--onbtn);font-size:16px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:10px}
.primary:active{transform:scale(.99)}
.primary:disabled{opacity:.6}
.ghost{min-height:52px;padding:0 32px;border-radius:16px;border:1px solid var(--ink);background:transparent;font-size:15px;font-weight:700}
.txtbtn{min-height:44px;padding:0 4px 0 12px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px;flex-shrink:0}

/* ===== Avisos ===== */
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.kicker.off{color:var(--dn)}
.kicker .ico{width:16px;height:16px}
.cola{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;line-height:1.35;padding:6px 6px 6px 14px;border-radius:14px;background:var(--tint);color:var(--ink)}
.cola span{flex:1}
.cola button{min-height:44px;padding:0 16px;border-radius:11px;border:0;background:var(--btn);color:var(--onbtn);font-size:13px;font-weight:700;flex-shrink:0}
.notice{font-size:14px;line-height:1.5;padding:12px 14px;border-radius:14px;background:var(--tint);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);padding:2px 4px 0}
.err{color:var(--dn);font-weight:600;text-align:center;font-size:14px;min-height:20px}
.err:empty{min-height:0}

/* ===== Carga / error ===== */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:40px 32px calc(40px + env(safe-area-inset-bottom))}
.center .msg{color:var(--muted);line-height:1.6;max-width:30ch}
.dial{width:44px;height:44px;color:var(--bronze)}
.dial .hand{transform-origin:22px 22px;animation:hand 1.6s steps(12) infinite}
@keyframes hand{to{transform:rotate(360deg)}}

/* ===== Elegir atleta ===== */
.home{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:28px}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.logo{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.logo .club{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--bronzeT);line-height:1}
.logo .name{font-family:var(--serif);font-weight:500;font-size:64px;line-height:.95;letter-spacing:.01em}
.bezel{display:flex;gap:7px;align-items:flex-end;height:12px;margin-top:16px}
.bezel i{display:block;width:1px;height:6px;background:var(--line2)}
.bezel i.q{height:12px;background:var(--bronze)}
.home h1{font-family:var(--serif);font-size:30px;line-height:1.1}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:14px}
.row{display:flex;align-items:center;gap:14px;min-height:72px;padding:10px 4px;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:active{background:var(--tint)}
.mono{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;font-weight:600;color:var(--bronzeT);flex-shrink:0}
.row .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .nm{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.1}
.row .fs{font-size:13px;color:var(--muted);font-weight:500}
.row .ico{color:var(--line2)}
.sec{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--bronzeT);margin:0}
.row.coach .mono{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.coachf{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.coachf input{font:inherit;font-size:18px;height:56px;border-radius:16px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);text-align:center;padding:0 16px}
.coachf input:focus{outline:2px solid var(--bronze);outline-offset:1px}
.empty{padding:28px 4px;color:var(--muted);line-height:1.6}

/* ===== PIN ===== */
.pinscr{flex:1;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));gap:12px}
.pinscr .hello{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:12px}
.pinscr h1{font-family:var(--serif);font-size:46px;line-height:1}
.pinscr .sub{color:var(--muted);font-size:15px}
.dots{display:flex;justify-content:center;gap:22px;padding:22px 0 6px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bronze);transition:background .12s}
.dot.on{background:var(--bronze)}
.dots.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 0;margin-top:auto;justify-items:center;padding-bottom:4px}
.key{width:78px;height:78px;border-radius:50%;border:1px solid var(--line);background:transparent;font-family:var(--serif);font-size:34px;font-weight:500;display:flex;align-items:center;justify-content:center;font-feature-settings:"lnum" 1}
.key:active{background:var(--tint);border-color:var(--line2)}
.key.del{border-color:transparent}
.key.blank{border-color:transparent;pointer-events:none}

/* ===== Sesión: cabecera ===== */
.head{padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line);background:var(--bg)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hrow .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.hrow h1{font-family:var(--serif);font-size:32px;line-height:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hact{display:flex;gap:8px;flex-shrink:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:14px;background:var(--tint)}
.seg button{min-height:50px;border-radius:11px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg .dn{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.seg .df{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hoy{font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;background:var(--btn);color:var(--onbtn)}
/* selector de días: hasta 7 */
.days{position:relative;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px;padding:2px 16px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;min-width:74px;min-height:54px;padding:6px 12px;border-radius:13px;border:1px solid var(--line);background:transparent;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;scroll-snap-align:center;color:var(--ink2);text-align:left}
.days button.on{background:var(--paper);border-color:var(--line2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.days .dn{font-size:14px;font-weight:700;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.days .dn em{font-style:normal;font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.days .df{font-size:11px;font-weight:600}
.days .hoy{align-self:center}
.days .df,.seg .df{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px;white-space:nowrap}
.df .ico{width:13px;height:13px;color:var(--bronzeT)}
.dayline{font-size:14px;font-weight:600;color:var(--ink2);display:flex;gap:8px;align-items:center}
.prog{display:flex;align-items:center;gap:14px}
.ticks{flex:1;display:flex;align-items:center;gap:5px;height:8px}
.ticks i{flex:1;height:2px;border-radius:2px;background:var(--line2)}
.ticks i.cur{height:6px;background:var(--ink)}
.ticks i.done{height:4px;background:var(--bronze)}
.ticks i.skip{background:repeating-linear-gradient(90deg,var(--line2) 0 3px,transparent 3px 6px)}
.ticks i.just{animation:tick .6s cubic-bezier(.2,.8,.2,1);transform-origin:left center}
@keyframes tick{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pc{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.pc b{color:var(--ink);font-weight:800}

/* ===== Sesión: lista ===== */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 12px 28px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;scroll-margin-top:12px}
.card.open{border-color:var(--line2);box-shadow:var(--shadow)}
.card.done,.card.off{background:transparent}
.chw{display:flex;align-items:flex-start;gap:4px;padding-right:10px}
.ch{flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:14px 4px 14px 14px;min-height:64px;border:0;background:transparent;text-align:left;border-radius:18px}
.num{width:28px;flex-shrink:0;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--bronzeT);line-height:1.3;font-feature-settings:"lnum" 1,"tnum" 1}
.mark{width:28px;height:28px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bronze);color:var(--bg)}
.mark .ico{width:16px;height:16px}
.mark.skip{background:transparent;border:1px solid var(--line2);color:var(--muted)}
.tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ename{font-feature-settings:"lnum" 1;font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.12;overflow-wrap:anywhere}
.card.off .ename{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--line2)}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.det{font-size:12px;font-weight:600;color:var(--bronzeT);padding:2px 9px;border-radius:9px;border:1px solid var(--line2);white-space:nowrap}
.same{color:var(--muted);font-weight:500}
.chg{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap}
.chg.up{color:var(--up);background:var(--upBg)}
.chg.dn{color:var(--dn);background:var(--dnBg)}
.skiptxt{color:var(--dn);font-weight:700}
.chev{width:20px;height:20px;color:var(--muted);flex-shrink:0;margin-top:4px;transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.card.done .chev,.card.off .chev,.card.open .chev{display:none}
.card.done .ename{font-size:21px}
.edit{font-size:12px;color:var(--muted);font-weight:600;align-self:center;flex-shrink:0;padding-left:6px;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}

/* cuerpo de la tarjeta abierta */
.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px}
.card.anim .body{animation:open .22s ease-out}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sets{display:grid;grid-template-columns:54px minmax(0,1fr) minmax(0,1fr);column-gap:8px;row-gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.colh{font-size:12px;font-weight:600;color:var(--muted);text-align:center;min-height:20px;display:flex;align-items:center;justify-content:center}
.colh:first-child{justify-content:flex-start}
.colh .quitar{min-height:36px;display:inline-flex;align-items:center;gap:4px;padding:0 10px;border-radius:18px;border:1px solid var(--line2);background:transparent;font-size:12px;font-weight:700;color:var(--ink2);margin:-8px 0}
.colh .quitar .ico{width:14px;height:14px}
.sl{display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:54px}
.sn{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1;font-feature-settings:"lnum" 1}
.tag{font-size:11px;font-weight:800;white-space:nowrap;line-height:1.25;font-variant-numeric:tabular-nums}
.tag.up{color:var(--up)}
.tag.dn{color:var(--dn)}
.stp{display:flex;align-items:stretch;height:54px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);overflow:hidden}
:root[data-theme="dark"] .stp{background:#142A1C}
.stp.up{border-color:var(--up);box-shadow:inset 0 0 0 1px var(--up)}
.stp.dn{border-color:var(--dn);box-shadow:inset 0 0 0 1px var(--dn)}
.stp button{width:44px;flex-shrink:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.stp button:active,.stp button.held{background:var(--tint)}
.stp button .ico{width:18px;height:18px}
.sv{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;font-family:var(--serif);font-size:25px;font-weight:600;line-height:54px;white-space:nowrap;font-feature-settings:"lnum" 1,"tnum" 1}
.stp.up .sv{color:var(--up)}
.stp.dn .sv{color:var(--dn)}
.suf{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--muted);margin-left:1px}
.sv.long{font-size:22px}
.sv.long .suf{font-size:10px}
.bw{grid-column:2;align-self:stretch;border:1px dashed var(--line2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;text-align:center}
.bw span{font-size:13px;font-weight:600;color:var(--muted)}
.bw button{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--bronze);background:transparent;font-size:13px;font-weight:700;color:var(--bronzeT);display:inline-flex;align-items:center;gap:6px}
.bw button .ico{width:16px;height:16px}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.paso{display:flex;align-items:center;gap:8px;min-width:0}
.paso .pl{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}
.pseg{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.pseg button{min-width:44px;height:44px;padding:0 6px;border:0;background:transparent;font-size:14px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.pseg button+button{border-left:1px solid var(--line2)}
.pseg button.on{background:var(--ink);color:var(--bg)}
:root[data-theme="dark"] .pseg button.on{background:var(--bronze);color:var(--onbtn)}
.hecho{min-height:48px;padding:0 18px 0 14px;border-radius:14px;border:0;background:var(--btn);color:var(--onbtn);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.hecho .ico{width:18px;height:18px}
/* carreras */
.runs{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
.rt{display:flex;flex-direction:column;gap:3px;min-width:0}
.rt label{font-size:12px;font-weight:600;color:var(--muted);padding-left:2px;font-variant-numeric:tabular-nums}
.rt input{width:100%;height:54px;border:1px solid var(--line2);border-radius:14px;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:25px;font-weight:600;text-align:center;font-feature-settings:"lnum" 1,"tnum" 1;padding:0 4px;-webkit-appearance:none;appearance:none;outline:none}
:root[data-theme="dark"] .rt input{background:#142A1C}
.rt input::placeholder{color:var(--line2);font-family:var(--sans);font-size:14px;font-weight:600}
.rt input:focus{border-color:var(--bronze);box-shadow:0 0 0 1px var(--bronze)}
.rt.up input{border-color:var(--up);color:var(--up)}
.rt.dn input{border-color:var(--dn);color:var(--dn)}
.rt.ok input{border-color:var(--bronze)}
.rt.bad input{border-style:dashed;border-color:var(--dn)}

    else if (v.diffs.length) cambios.push({ ej: v.e.ejercicio, t: v.diffs.map(function (d) { return d.t; }).join(' · '), cls: v.diffs[0].cls, diffs: v.diffs });
  });
  // fecha / sesion / diaNombre viajan para poder reubicar el envío si el plan cambia de lugar (el servidor los ignora)
  var item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), accion: 'guardar', nombre: S.atleta, pin: S.pinOk,
    hoja: S.sesion.hoja, dia: dia.indice, registros: registros, bienestar: bienestar, fecha: dia.fecha, sesion: dia.sesion, diaNombre: dia.nombre, creado: new Date().toISOString() };
  // reemplaza un envío pendiente de la misma sesión, si lo había
  guardarCola(cola().filter(function (q) { return !(q.nombre === item.nombre && q.hoja === item.hoja && mismoDia(q.dia, item.dia)); }).concat([item]));
  var resumen = { id: item.id, estado: 'enviando', txt: dia.nombre + ' · ' + dia.fechaTexto + ' · ' + vs.length + (vs.length === 1 ? ' ejercicio' : ' ejercicios') + (cambios.some(function (c) { return !c.run; }) ? '' : ', todo según el plan'), cambios: cambios, carreras: cambios.some(function (c) { return c.run; }), bien: resumenBien(bienestar) };
  // Al instante: la sesión ya está a salvo en el celular (cola). El envío a la hoja sigue en segundo plano.
  S.error = '';
  terminar(dia, resumen);
  enviarCola().then(function () { estadoEnvio(resumen, dia); });
}
function estadoEnvio(resumen, dia) {
  var q = cola().filter(function (x) { return x.id === resumen.id; })[0];
  resumen.estado = !q ? 'ok' : q.planViejo ? 'plan' : q.ultimoError ? 'error' : 'pendiente';
  resumen.msg = q ? q.ultimoError || '' : '';

  if (!q && dia) { S.sinRed = false; dia.guardadoLocal = true; cacheSesion(); }

}
function terminar(dia, resumen) {
  limpiarDia(dia);
  resumen.sig = otraSesion(dia);
  if (S.planNuevo) {   // llegó un plan nuevo mientras guardaba: se usa desde ahora
    var j = S.planNuevo, sig = resumen.sig != null ? S.sesion.dias[resumen.sig] : null; S.planNuevo = null;
    var dn = sig && buscarSesion(j, { dia: sig.indice, fecha: sig.fecha, sesion: sig.sesion, registros: sig.ejercicios });
    resumen.sig = dn ? j.dias.indexOf(dn) : null; resumen.dia = null; S.sesion = j;
  } else resumen.dia = dia;
  S.resumen = resumen; S.cierre = null; S.pendRes = null; S.screen = 'listo'; render();
}

// ===== "Recargar plan": vuelve a pedir el plan y reubica lo guardado (cola, borrador, llegada) =====
function parseK(id) { var m = String(id).match(/^k(\d+)-(\d)-(\d)$/); return m ? { k: +m[2], n: +m[3] } : null; }
function buscarSesion(plan, ref) {
  var ds = plan.dias || [], pk = parseK(ref.dia);
  return ds.filter(function (d) { return ref.fecha && d.fecha === ref.fecha && Number(d.sesion || 1) === Number(ref.sesion || 1); })[0] ||
    (pk && ds.filter(function (d) { var x = parseK(d.indice); return x && x.k === pk.k && x.n === pk.n; })[0]) ||
    ds.filter(function (d) { var ns = d.ejercicios.map(function (e) { return e.ejercicio.toLowerCase(); }); return (ref.registros || []).length && ref.registros.every(function (r) { return ns.indexOf(String(r.ejercicio).toLowerCase()) >= 0; }); })[0] || null;
}
// Para cada ejercicio de la sesión vieja, su posición en la nueva (por nombre y orden de aparición)
function mapaEjercicios(viejos, nuevos) {
  var usados = {}, m = {};
  viejos.forEach(function (e, i) {
    for (var j = 0; j < nuevos.length; j++) if (!usados[j] && String(nuevos[j].ejercicio).toLowerCase() === String(e.ejercicio).toLowerCase()) { usados[j] = 1; m[i] = j; break; }
  });
  return m;
}
function reubicarItem(q, plan) {
  if (q.hoja !== plan.hoja) return false;
  var d = buscarSesion(plan, q); if (!d) return false;
  var usados = {};
  q.registros.forEach(function (r) {
    for (var j = 0; j < d.ejercicios.length; j++) if (!usados[j] && String(d.ejercicios[j].ejercicio).toLowerCase() === String(r.ejercicio).toLowerCase()) { usados[j] = 1; r.fila = d.ejercicios[j].fila; break; }
  });
  q.dia = d.indice; q.fecha = d.fecha; q.sesion = d.sesion; q.diaNombre = d.nombre;
  delete q.planViejo; delete q.ultimoError; delete q.intentos;
  return true;
}
function reubicarPantalla(viejo, nuevo) {
  var maps = ['ov', 'omit', 'lastre', 'paso', 'hecho', 't'], nv = {}, cks = checkins(), tmp = {}, actual = viejo.dias[S.dia], diaNuevo = null;
  maps.forEach(function (m) { nv[m] = {}; });
  viejo.dias.forEach(function (dv) {
    var dn = buscarSesion(nuevo, { dia: dv.indice, fecha: dv.fecha, sesion: dv.sesion, registros: dv.ejercicios });
    if (!dn) return;
    if (dv === actual) diaNuevo = dn;
    var kv = diaKey(dv) + '-', kn = diaKey(dn) + '-', me = mapaEjercicios(dv.ejercicios, dn.ejercicios);
    maps.forEach(function (m) {
      Object.keys(S[m]).forEach(function (k) {
        if (k.indexOf(kv) !== 0) return;
        var resto = k.slice(kv.length).split('-'), ni = me[+resto[0]];
        if (ni == null) return;
        resto[0] = ni; nv[m][kn + resto.join('-')] = S[m][k];
      });
    });
    var cv = ciKey(dv, viejo.hoja), cn = ciKey(dn, nuevo.hoja);
    if (cks[cv]) { var x = cks[cv]; delete cks[cv]; cks[cn] = x; }
    if (S.tmp[diaId(dv)]) tmp[diaId(dn)] = S.tmp[diaId(dv)];
  });
  guardarCheckins(cks); S.tmp = tmp;
  borrador({ atleta: S.atleta, hoja: nuevo.hoja, diaId: diaNuevo ? diaId(diaNuevo) : null, ov: nv.ov, omit: nv.omit, lastre: nv.lastre, paso: nv.paso, hecho: nv.hecho, t: nv.t });
}
function recargarPlan() {
  var mal = cola().filter(function (x) { return x.planViejo; })[0];
  var nombre = S.atleta || (mal && mal.nombre), pin = S.pinOk || store('chronos-pin') || (mal && mal.pin);
  if (!nombre || !pin || S.recargando) return;
  S.recargando = true; S.error = ''; render(true);
  api({ accion: 'sesion', nombre: nombre, pin: pin }).then(function (j) {
    S.sinRed = false;
    store('chronos-sesion-' + nombre, JSON.stringify(j));
    guardarCola(cola().map(function (q) { if (q.planViejo && q.nombre === nombre) reubicarItem(q, j); return q; }));
    var enSesion = S.screen === 'sesion' && S.atleta === nombre && S.sesion;
    if (enSesion) { reubicarPantalla(S.sesion, j); mostrarSesion(j, pin, true); }
    return enviarCola().then(function () {
      S.recargando = false;
      if (S.screen === 'listo' && S.resumen && S.resumen.id) estadoEnvio(S.resumen, null);
      var p = S.pendRes;
      if (enSesion && p && !cola().some(function (q) { return q.id === p.id; })) {
        var d = S.sesion.dias.filter(function (x) { return x.fecha === p.fecha && Number(x.sesion || 1) === Number(p.sesion || 1); })[0];
        if (d) { S.dia = S.sesion.dias.indexOf(d); return terminar(d, p.resumen, false); }
      }
      render();
    });
  }).catch(function (e) {
    S.recargando = false; S.error = e.red ? 'Sin conexión. Recarga el plan cuando tengas internet; tus datos siguen guardados.' : e.message; render();
  });
}
function setOv(key, k, f, val) { var id = key + '-' + k; S.ov[id] = Object.assign({}, S.ov[id]); S.ov[id][f] = val; }
// Un toque de + o − (peso o repeticiones)
function aplicarPaso(b) {
  var key = b.dataset.key, v = vistaDe(key); if (!v) return;
  var s = v.sets[+b.dataset.k]; if (!s) return;
  if (b.dataset.act === 'w') setOv(key, s.k, 'w', Math.max(0, Math.round((s.w + v.paso * (+b.dataset.d)) * 10) / 10));

}
// Actualiza solo una serie en pantalla (para mantener apretado sin redibujar todo)
function pintarSerie(key, k) {
  var v = vistaDe(key); if (!v) return; var s = v.sets[k], id = key + '-' + k;
  var w = document.querySelector('[data-val="w-' + id + '"]'), r = document.querySelector('[data-val="r-' + id + '"]'), t = document.querySelector('[data-tag="' + id + '"]');
  if (w) { w.textContent = fmt(s.w); w.parentNode.className = 'stp' + (s.dw > 0 ? ' up' : s.dw < 0 ? ' dn' : ''); }
  if (r) { r.innerHTML = repsHTML(s.r, v.R.suf); r.parentNode.className = 'stp' + (s.dr > 0 ? ' up' : s.dr < 0 ? ' dn' : ''); }
  if (t) t.innerHTML = tagsHTML(s);
}
function irATarjeta(key) {
  if (!key) return;
  var el = document.querySelector('.card[data-key="' + key + '"]');
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start', behavior: reduce() ? 'auto' : 'smooth' });
}

// ---- Mantener apretado + o − repite el toque ----
var hold = null, tragarClick = false;
document.addEventListener('pointerdown', function (ev) {
  var b = ev.target.closest && ev.target.closest('[data-act="w"],[data-act="r"]');
  if (!b || (ev.button && ev.button !== 0)) return;
  if (hold) clearTimeout(hold.t);
  var h = hold = { b: b, x: ev.clientX, y: ev.clientY, rep: false, n: 0 };
  h.t = setTimeout(function paso() {
    if (hold !== h) return;
    if (!h.rep) { h.rep = true; b.classList.add('held'); try { b.setPointerCapture(ev.pointerId); } catch (e) {} }
    aplicarPaso(b); pintarSerie(b.dataset.key, +b.dataset.k);
    h.n++; h.t = setTimeout(paso, h.n > 8 ? 70 : 140);
  }, 450);
});
document.addEventListener('pointermove', function (ev) {
  if (hold && !hold.rep && (Math.abs(ev.clientX - hold.x) > 10 || Math.abs(ev.clientY - hold.y) > 10)) { clearTimeout(hold.t); hold = null; }
});
function soltar() {
  if (!hold) return;
  clearTimeout(hold.t);
  var fue = hold.rep; hold = null;
  if (fue) { tragarClick = true; setTimeout(function () { tragarClick = false; }, 400); guardarBorrador(); render(); }
}
['pointerup', 'pointercancel', 'blur'].forEach(function (t) { window.addEventListener(t, soltar); });
document.addEventListener('contextmenu', function (ev) { if (ev.target.closest && ev.target.closest('.stp')) ev.preventDefault(); });

document.addEventListener('input', function (ev) {
  var t = ev.target; if (!t.dataset || !t.dataset.t) return;
  S.t[t.dataset.t] = t.value; if (S.error) { S.error = ''; var er = document.querySelector('.foot .err'); if (er) er.textContent = ''; }
  pintarCarrera(t.dataset.key); guardarBorrador();
});
document.addEventListener('change', function (ev) {
  var t = ev.target; if (!t.dataset || !t.dataset.t) return;
  var v = parseT(t.value); if (v != null && !isNaN(v)) { t.value = t.value.trim().replace(/\./g, ','); S.t[t.dataset.t] = t.value; guardarBorrador(); }
});
document.addEventListener('keydown', function (ev) {
  var t = ev.target; if (!t.dataset || !t.dataset.t || ev.key !== 'Enter') return;
  ev.preventDefault();
  var sig = document.querySelector('[data-t][data-key="' + t.dataset.key + '"][data-j="' + (+t.dataset.j + 1) + '"]');
  if (sig) sig.focus(); else t.blur();
});
document.addEventListener('focusout', function () { setTimeout(function () { if (S.renderPend && !escribiendo()) render(); }, 0); });
document.addEventListener('click', function (ev) {
  if (ev.target.closest('[data-t]')) return;
  var b = ev.target.closest('[data-act]'); if (!b) return;
  if (escribiendo()) document.activeElement.blur();
  var a = b.dataset.act, key = b.dataset.key;
  if ((a === 'w' || a === 'r') && tragarClick) { tragarClick = false; return; }
  if (a === 'tema') { var d = document.documentElement.getAttribute('data-theme') === 'dark'; if (d) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'dark'); store('chronos-tema', d ? 'light' : 'dark'); render(); return; }
  if (a === 'reintentar') return cargarAtletas();
  if (a === 'enviar') { b.textContent = 'Enviando…'; enviarCola(); return; }
  if (a === 'elegir') { S.atleta = S.atletas[+b.dataset.i].nombre; S.pin = ''; S.error = ''; S.screen = 'pin'; return render(); }
  if (a === 'volver') { S.screen = 'nombre'; S.pin = ''; S.error = ''; return render(); }
  if (a === 'coach') {
    if (store('chronos-panel-clave') && store('chronos-panel-datos')) return abrirPanel();     // ya entró antes en este celular
    S.screen = 'coach'; S.error = ''; render(); setTimeout(function () { var i = document.getElementById('clavec'); if (i) i.focus(); }, 60); return;
  }
  if (a === 'tecla') {
    var k = b.dataset.k;
    if (S.pin.length === 4) return;
    if (k === '⌫') S.pin = S.pin.slice(0, -1); else if (S.pin.length < 4) S.pin += k;
    S.error = ''; render();
    if (S.pin.length === 4) setTimeout(function () { abrirSesion(S.pin); }, 200);
    return;
  }
  if (a === 'salir') { if (cola().some(function (q) { return q.nombre === S.atleta; }) && S.screen !== 'listo' && !confirm('Tienes una sesión sin enviar. Se enviará cuando haya internet. ¿Salir igual?')) return; store('chronos-atleta', null); store('chronos-pin', null); borrador(null); S.atleta = null; S.sesion = null; S.screen = 'nombre'; return render(); }
  if (a === 'dia') { S.dia = +b.dataset.i; S.abierto = null; S.error = ''; S.cierre = null; S.editCI = null; var sc = document.querySelector('.scroll'); if (sc) sc.scrollTop = 0; render(); var sc2 = document.querySelector('.scroll'); if (sc2) sc2.scrollTop = 0; guardarBorrador(); return; }
  if (a === 'guardar') return abrirCierre();
  if (a === 'recargar') return recargarPlan();
  if (a === 'siguiente') { S.dia = S.resumen.sig; S.abierto = null; S.error = ''; S.screen = 'sesion'; render(); var s0 = document.querySelector('.scroll'); if (s0) s0.scrollTop = 0; return; }
  if (S.screen === 'sesion' && S.sesion && S.sesion.dias[S.dia]) {
    var dd = S.sesion.dias[S.dia], tt = tmpDe(dd);
    if (a === 'bien') {
      tt[b.dataset.f] = +b.dataset.v; S.error = '';
      var sc0 = document.querySelector('.scroll'), y0 = sc0 ? sc0.scrollTop : 0;
      render(); var sc1 = document.querySelector('.scroll'); if (sc1) sc1.scrollTop = y0;
      return;
    }

      var f1 = faltan(tt, ['animoInicio', 'energia']);
      if (f1.length) { S.error = 'Falta responder ' + listaY(f1.map(function (c) { return FALTA[c]; })) + '.'; render(); irAPregunta(f1[0]); return; }
      var ck0 = checkin(dd);
      ponerCheckin(dd, { animoInicio: tt.animoInicio, energia: tt.energia, inicio: (ck0 && ck0.inicio) || new Date().toISOString() });
      S.editCI = null; S.error = ''; S.anim = abiertoKey(vistas()); render();
      var s2 = document.querySelector('.scroll'); if (s2) s2.scrollTop = 0;
      return;
    }
    if (a === 'editarCI') { var ck1 = checkin(dd); if (ck1) { tt.animoInicio = ck1.animoInicio; tt.energia = ck1.energia; } S.editCI = diaId(dd); S.error = ''; render(); var s3 = document.querySelector('.scroll'); if (s3) s3.scrollTop = 0; return; }
    if (a === 'volverCierre') { S.cierre = null; S.error = ''; render(); return; }
    if (a === 'min') { var m0 = tt.minutos || 60; tt.minutos = clampMin(+b.dataset.d > 0 ? Math.floor(m0 / 5) * 5 + 5 : Math.ceil(m0 / 5) * 5 - 5); tt.minAjust = true; var s4 = document.querySelector('.scroll'), y4 = s4 ? s4.scrollTop : 0; render(); var s5 = document.querySelector('.scroll'); if (s5) s5.scrollTop = y4; return; }
    if (a === 'confirmar') {
      if (S.guardando) return;
      var f2 = faltan(tt, (checkin(dd) ? [] : ['animoInicio', 'energia']).concat(['animoFin', 'rpe']));
      if (f2.length) { S.error = 'Falta responder ' + listaY(f2.map(function (c) { return FALTA[c]; })) + '.'; render(true); irAPregunta(f2[0]); return; }
      return guardar();
    }
  }
  var v = vistaDe(key); if (!v) return;
  var ir = null;
  if (a === 'abrir') {
    var ab = abiertoKey(vistas());
    if (v.hecho) { S.hecho[key] = false; S.abierto = key; S.anim = key; ir = key; }
    else if (ab === key) S.abierto = '';
    else { S.abierto = key; S.anim = key; ir = key; }
  }
  if (a === 'hecho') { S.hecho[key] = true; S.abierto = null; S.just = key; }
  if (a === 'omitir') { S.omit[key] = !v.omit; if (v.omit) { S.abierto = key; S.anim = key; } else { S.abierto = null; S.just = key; } }
  if (a === 'paso') S.paso[key] = parseFloat(b.dataset.p);
  if (a === 'lastre') { S.lastre[key] = !v.esLastre; for (var q = 0; q < v.e.s; q++) { var id = key + '-' + q; if (S.ov[id]) delete S.ov[id].w; } }
  if (a === 'w' || a === 'r') aplicarPaso(b);
  guardarBorrador();

  render();
  if (ir) irATarjeta(ir);
});

if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(function () {}); }
cargarAtletas();
